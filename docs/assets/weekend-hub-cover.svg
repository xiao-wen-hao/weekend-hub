<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="周末局：从一句想法到一起成行">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f5ed"/><stop offset="1" stop-color="#eaf1e7"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164f3c"/><stop offset="1" stop-color="#287a4b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#234634" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1105" cy="-55" r="265" fill="#dcebd5" opacity=".65"/>
  <circle cx="1265" cy="430" r="205" fill="#e2eddc" opacity=".75"/>
  <rect x="54" y="58" width="74" height="74" rx="22" fill="url(#green)"/>
  <text x="91" y="109" text-anchor="middle" fill="#fff" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">局</text>
  <text x="151" y="108" fill="#193d30" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="700">周末局</text>
  <text x="57" y="218" fill="#193d30" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="49" font-weight="700">把周末的想法，</text>
  <text x="57" y="283" fill="#193d30" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="49" font-weight="700">变成大家的计划。</text>
  <text x="58" y="344" fill="#60776b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23">自然表达 · 发现共同兴趣 · 一起商量 · 自己决定</text>
  <rect x="57" y="391" width="215" height="48" rx="24" fill="#287a4b"/>
  <text x="164" y="423" text-anchor="middle" fill="#fff" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="600">Weekend Hub  →</text>
  <g filter="url(#shadow)" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
    <rect x="690" y="72" width="470" height="100" rx="25" fill="#fff"/>
    <circle cx="734" cy="122" r="23" fill="#e8f3e5"/><text x="734" y="130" text-anchor="middle" font-size="21" fill="#287a4b">✦</text>
    <text x="774" y="115" font-size="19" fill="#789083">一个人的想法</text><text x="774" y="146" font-size="24" font-weight="600" fill="#1f3d30">“周末想出去走走……”</text>
    <rect x="738" y="194" width="470" height="100" rx="25" fill="#fff"/>
    <circle cx="782" cy="244" r="23" fill="#e8f3e5"/><text x="782" y="251" text-anchor="middle" font-size="22" fill="#287a4b">↗</text>
    <text x="822" y="237" font-size="19" fill="#789083">朋友们的共同兴趣</text><text x="822" y="268" font-size="24" font-weight="600" fill="#1f3d30">“我们来商量一下？”</text>
    <rect x="690" y="316" width="470" height="100" rx="25" fill="#fff"/>
    <circle cx="734" cy="366" r="23" fill="#e8f3e5"/><text x="734" y="374" text-anchor="middle" font-size="23" fill="#287a4b">✓</text>
    <text x="774" y="359" font-size="19" fill="#789083">一起确认的安排</text><text x="774" y="390" font-size="24" font-weight="600" fill="#1f3d30">“这次，真的成行了。”</text>
  </g>
  <path d="M1172 168c23 9 30 15 31 26M1172 289c-15 10-19 17-19 27" fill="none" stroke="#86ae8e" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 8"/>
</svg>
